name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: xhs-workshop-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFiles = Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Extension -eq ".blockmap" -or
            $_.Name -eq "latest.yml"
          } | ForEach-Object { $_.FullName }

          if (-not $releaseFiles) {
            throw "No Windows release files were generated."
          }

          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $releaseFiles --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" $releaseFiles `
              --verify-tag `
              --title "$env:GITHUB_REF_NAME" `
              --generate-notes
          }
